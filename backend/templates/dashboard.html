<!DOCTYPE html>
<html>

<head>

    <title>InfraPulse Enterprise Monitor</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>

        body{
            background:#0f172a;
            color:white;
        }

        .sidebar{
            height:100vh;
            background:#111827;
            padding:20px;
        }

        .card{
            background:#1e293b;
            color:white;
            border:none;
            transition:.3s;
            border-radius:15px;
        }

        .card:hover{
            transform:translateY(-5px);
            box-shadow:0px 0px 20px rgba(96,165,250,.3);
        }

        .nav-link{
            color:white;
            margin-bottom:10px;
        }

        .nav-link:hover{
            color:#60a5fa;
        }

        .navbar{
            background:#111827;
            border-radius:10px;
            padding:10px;
        }

    </style>

</head>

<body>

<div class="container-fluid">

<div class="row">

<div class="col-2 sidebar">

    <h3>⚡ InfraPulse</h3>

    <hr>

    <ul class="nav flex-column">

        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-server"></i> Servers
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-activity"></i> Monitoring
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-bell"></i> Alerts
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-file-earmark-bar-graph"></i> Reports
            </a>
        </li>

        <li class="nav-item">
            <a class="nav-link" href="#">
                <i class="bi bi-gear"></i> Settings
            </a>
        </li>

    </ul>

</div>

<div class="col-10 p-4">

    <nav class="navbar navbar-dark mb-4">

        <div class="container-fluid">

            <span class="navbar-brand">

                ⚡ InfraPulse Enterprise Monitor

            </span>

            <button class="btn btn-outline-light btn-sm">

                🌙 Dark Mode

            </button>

        </div>

    </nav>

    <div class="row">

        <div class="col-md-3 mb-3">

            <div class="card p-3">

                <h6><i class="bi bi-server"></i> Total Servers</h6>

                <h2>0</h2>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card p-3">

                <h6><i class="bi bi-check-circle-fill"></i> Healthy</h6>

                <h2>0</h2>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card p-3">

                <h6><i class="bi bi-exclamation-triangle-fill"></i> Warning</h6>

                <h2>0</h2>

            </div>

        </div>

        <div class="col-md-3 mb-3">

            <div class="card p-3">

                <h6><i class="bi bi-x-octagon-fill"></i> Critical</h6>

                <h2>0</h2>

            </div>

        </div>

    </div>

    <div class="row mb-4">

        <div class="col-md-6">

            <div class="card p-4">

                <h5>CPU Usage</h5>

                <canvas id="cpuChart"></canvas>

            </div>

        </div>

        <div class="col-md-6">

            <div class="card p-4">

                <h5>Memory Usage</h5>

                <canvas id="memoryChart"></canvas>

            </div>

        </div>

    </div>

    <div class="card p-4">

        <h4>Recent Alerts</h4>

        <table class="table table-dark">

            <thead>

                <tr>

                    <th>Time</th>
                    <th>Server</th>
                    <th>Alert</th>
                    <th>Severity</th>

                </tr>

            </thead>

            <tbody>

                <tr>

                    <td>10:00 AM</td>
                    <td>WIN-SRV01</td>
                    <td>CPU High</td>
                    <td>Critical</td>

                </tr>

            </tbody>

        </table>

    </div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

new Chart(
document.getElementById('cpuChart'),
{
type:'line',
data:{
labels:['Mon','Tue','Wed','Thu','Fri'],
datasets:[{
label:'CPU',
data:[20,40,30,50,25]
}]
}
});

new Chart(
document.getElementById('memoryChart'),
{
type:'line',
data:{
labels:['Mon','Tue','Wed','Thu','Fri'],
datasets:[{
label:'Memory',
data:[50,60,45,70,55]
}]
}
});

</script>

</body>

</html>
